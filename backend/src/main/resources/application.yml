spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: hireflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hireflow_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  ai:
    model:
      chat: ${AI_MODEL_CHAT:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        model: ${OPENAI_MODEL:gpt-4o-mini}
        temperature: 0.2
    google:
      genai:
        api-key: ${GEMINI_API_KEY:${OPENAI_API_KEY:}}
        chat:
          model: ${GEMINI_MODEL:gemini-3.8-flash}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    refresh-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  upload-dir: ${UPLOAD_DIR:./uploads}
  ai:
    enabled: ${AI_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.hireflow.backend: INFO
    org.springframework.ai: WARN

info:
  app:
    name: Hireflow Internship Tracker API
    version: 1.0.0
