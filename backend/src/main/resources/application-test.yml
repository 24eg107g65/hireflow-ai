spring:
  datasource:
    url: jdbc:h2:mem:hireflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  ai:
    model:
      chat: none

app:
  jwt:
    secret: ${random.uuid}
  ai:
    enabled: false
  upload-dir: ${java.io.tmpdir}/hireflow-test-uploads
  cors:
    allowed-origins: http://localhost:5173
